services:
  inbox:
    build:
      context: .
      dockerfile: Dockerfile.inbox
    working_dir: /data
    env_file:
      - .env
    environment:
      LDN_SERVER_HOST: 0.0.0.0
    volumes:
      - ./conf:/data/conf
      - ./inbox:/data/inbox
    ports:
      - "5051:5051"
    restart: unless-stopped

  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    env_file:
      - .env
    volumes:
      - ./token:/app/token:ro
    ports:
      - "5052:5052"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_INBOX_URL: ${VITE_INBOX_URL:-/inbox/}
        VITE_VALIDATOR_URL: ${VITE_VALIDATOR_URL:-/validate}
        VITE_RELAY_URL: ${VITE_RELAY_URL:-/relay/}
    environment:
      VALIDATOR_UPSTREAM: ${VALIDATOR_UPSTREAM:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    depends_on:
      - inbox
      - relay
    restart: unless-stopped
