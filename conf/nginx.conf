# Processed by the nginx image's envsubst at container start: ${VALIDATOR_UPSTREAM}
# is filled from the web container's env before nginx parses this file. Set it to
# the validator's scheme://host:port (no path), e.g. http://validator:3000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /inbox/ {
        proxy_pass http://inbox:5051/inbox/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /validate {
        proxy_pass ${VALIDATOR_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
